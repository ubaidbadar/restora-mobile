name: Native Android (Kotlin)
on:
  push:
    branches: [feature/kotlin-android-native]
    paths:
      - 'android-native/**'
      - '.github/workflows/native-android.yml'
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/native-android.yml'

# Push + pull_request can fire for the same commit; avoid overlapping full builds.
concurrency:
  group: native-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          # This long-lived feature branch can populate the cache for later pushes.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Reject known deprecated API usage
        working-directory: android-native
        run: python3 scripts/check_api_surface.py
      - name: Build, unit tests, and lint
        working-directory: android-native
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --warning-mode=fail --stacktrace
