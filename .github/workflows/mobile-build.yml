name: Build Android APK (GitHub runner)

on:
  push:
    branches: [main, dev, stage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://restora.live' }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL || 'https://app.restora.live' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify app
        run: yarn verify

      - name: Write optional Firebase config for Android notifications
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > google-services.json
            echo "GOOGLE_SERVICES_JSON=./google-services.json" >> "$GITHUB_ENV"
          fi

      - name: Generate Android project locally
        run: npx expo prebuild --platform android --non-interactive --clean

      # Reuse Play release signing when configured. Without these secrets, Expo's
      # prebuilt Android release variant uses the Android debug keystore.
      # Those fallback APKs are installable but cannot reliably update each
      # other or a Play Store installation because signing identities differ.
      - name: Set up optional release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          count=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$value" ]; then count=$((count + 1)); fi
          done
          if [ "$count" -eq 0 ]; then
            echo "::notice::No release keystore configured. The APK will use temporary Android debug signing."
            exit 0
          fi
          if [ "$count" -ne 4 ]; then
            echo "::error::Partial Android keystore settings. Set all four signing secrets or none."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.keystore
          {
            printf '\nMYAPP_UPLOAD_STORE_FILE=upload-keystore.keystore\n'
            printf 'MYAPP_UPLOAD_STORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'MYAPP_UPLOAD_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'MYAPP_UPLOAD_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> android/gradle.properties
          echo "USE_RELEASE_KEY=true" >> "$GITHUB_ENV"

      - name: Configure release signing
        if: env.USE_RELEASE_KEY == 'true'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const filename = 'android/app/build.gradle';
          let source = fs.readFileSync(filename, 'utf8');
          if (!source.includes('signingConfigs {') || !source.includes('signingConfig signingConfigs.debug')) {
            throw new Error('Could not locate the Expo-generated Android release signing configuration');
          }
          const signing = [
            '        release {',
            '            storeFile file(MYAPP_UPLOAD_STORE_FILE)',
            '            storePassword MYAPP_UPLOAD_STORE_PASSWORD',
            '            keyAlias MYAPP_UPLOAD_KEY_ALIAS',
            '            keyPassword MYAPP_UPLOAD_KEY_PASSWORD',
            '        }'
          ].join('\n');
          source = source.replace('signingConfigs {', 'signingConfigs {\n' + signing);
          const original = 'signingConfig signingConfigs.debug';
          const index = source.lastIndexOf(original);
          source = source.slice(0, index) + 'signingConfig signingConfigs.release' + source.slice(index + original.length);
          fs.writeFileSync(filename, source);
          NODE

      - name: Build standalone Android release APK
        run: |
          # No inline modules are configured in Restora; force a valid empty JSON
          # list to avoid the SDK 58 autolinking JSON parse failure seen in Gradle.
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace '-Pexpo.inlineModules.watchedDirectories=[]'

      - name: Validate Android APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -tqq "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/Restora-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Restora-android-${{ github.run_number }}
          path: artifacts/Restora-android.apk
          if-no-files-found: error
          retention-days: 30
