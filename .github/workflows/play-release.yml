name: Play Store release

on:
  push:
    branches: [dev, stage, main]

permissions:
  contents: read

concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify
        run: yarn verify

      - name: Check release secrets
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON secret."; exit 1; fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "Missing ANDROID_KEYSTORE_BASE64 secret."; exit 1; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "Missing KEYSTORE_PASSWORD secret."; exit 1; fi
          if [ -z "$KEY_ALIAS" ]; then echo "Missing KEY_ALIAS secret."; exit 1; fi
          if [ -z "$KEY_PASSWORD" ]; then echo "Missing KEY_PASSWORD secret."; exit 1; fi

      - name: Select Play track
        run: |
          case "${GITHUB_REF_NAME}" in
            dev) echo "TRACK=internal" >> "$GITHUB_ENV" ;;
            stage) echo "TRACK=beta" >> "$GITHUB_ENV" ;;
            main) echo "TRACK=production" >> "$GITHUB_ENV" ;;
          esac

      - name: Restore built AAB from cache
        id: aab-cache
        uses: actions/cache@v4
        with:
          path: android/app/build/outputs/bundle/release/app-release.aab
          key: aab-${{ github.sha }}

      - name: Prebuild Android project
        if: steps.aab-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Write upload keystore
        if: steps.aab-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.keystore

      - name: Write signing properties
        if: steps.aab-cache.outputs.cache-hit != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "MYAPP_UPLOAD_STORE_FILE=upload-keystore.keystore"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties

      - name: Set version code
        if: steps.aab-cache.outputs.cache-hit != 'true'
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build Android app bundle
        if: steps.aab-cache.outputs.cache-hit != 'true'
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          packageName: com.restora.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ env.TRACK }}
          status: completed
