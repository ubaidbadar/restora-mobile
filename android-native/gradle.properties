# Local build speed: reuse unchanged task outputs and the Gradle task graph.
# Run a warm debug build twice to verify cache reuse on your machine.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.parallel=true

# Keep the heap moderate. Increase only if Android Studio's Build Analyzer shows heavy GC.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

android.useAndroidX=true
kotlin.code.style=official
